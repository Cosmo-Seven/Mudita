{% load translate %}
<div class="col-12 col-md-6 col-xl-3">
    <form method="GET" class="gap-2 d-flex align-items-end mb-3">
        <div>
            <label class="form-label">{% translate 'search' request.session.language %}</label>
            <input type="text" name="search" value="{{ search }}"
                placeholder="{% translate 'search' request.session.language %} ..." class="form-control" />
        </div>
        <input type="hidden" name="page" value="{{page}}">
        <input type="hidden" name="entries" value="{{entries}}">
        <input type="hidden" name="date" value="{{date}}">
        <input type="hidden" name="date_range" value="{{date_range}}">
        <button type="submit" class="btn btn-primary text-nowrap">{% translate 'search' request.session.language %}</button>
    </form>
</div>
