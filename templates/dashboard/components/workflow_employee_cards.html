{% load translate %}
{% for wf in workflows %}
    {% include "dashboard/components/_workflow_employee_card.html" %}
{% empty %}
<p class="text-muted text-center py-3">{% translate 'no_employees_found' request.session.language %}</p>
{% endfor %}

<style>
    .workflow-employee-card { border: 1px solid #f0e4b8; border-radius: 10px; padding: 14px; margin: 10px; background: #fdfaf0; }
    .workflow-employee-body { display: grid; grid-template-columns: 1.2fr 1fr 1.4fr; gap: 16px; align-items: start; }
    .stage-chip { border-radius: 999px; padding: 5px 12px; font-size: 12px; border: 1px solid #e2e6ef; color: #8a94a6; background: #fff; cursor: pointer; transition: all .15s ease; }
    .stage-chip:hover { border-color: #f59e0b; }
    .stage-chip-done { background: #dcfce7; color: #15803d; border-color: #15803d; }
    .stage-chip-current { background: #fff7e6; color: #b45309; border-color: #f59e0b; font-weight: 700; }
    .wf-status-badge { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .wf-status-pending { background: #eef1f6; color: #64748b; }
    .wf-status-in_progress { background: #fff7e6; color: #b45309; }
    .wf-status-completed { background: #dcfce7; color: #15803d; }
    .wf-status-cancelled { background: #f1f1f1; color: #6b7280; text-decoration: line-through; }
    @media (max-width: 991px) { .workflow-employee-body { grid-template-columns: 1fr; } }
</style>
