{% extends 'dashboard/layouts/base.html' %}
{% load translate %}
{% block title %}{% translate 'workflow' request.session.language %}{% endblock %}
{% block body %}
<div class="page-wrapper">
    <div class="content">
        {% include "dashboard/components/workflow_dashboard_content.html" %}
    </div>

    <div class="modal fade" id="workflowStepsModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" id="workflowStepsModalContent">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</div>

    <div class="modal fade" id="addEmployeeWorkflowModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" id="addEmployeeModalContent">
            <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
    </div>
    <div class="modal fade" id="jobFormModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" id="jobFormModalContent">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<style>
    .workflow-stat { border-radius: 8px; padding: 16px; color: #fff; text-align: center; }
    .workflow-stat h2 { font-size: 32px; font-weight: 800; margin-bottom: 2px; }
    .workflow-stat span { font-size: 13px; opacity: .9; }
    .bg-orange { background: #ff8a3d; } .bg-orange-dark { background: #ff7a1a; }

    .stage-pill-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .stage-pill {
        border: 1px solid #e2e6ef; border-radius: 999px; padding: 8px 16px;
        font-size: 13px; font-weight: 500; color: #556; display: flex; align-items: center; gap: 6px;
    }
    .stage-pill-count {
        background: #e9ecf3; border-radius: 999px; min-width: 20px; height: 20px;
        display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
    }
    .stage-pill-active .stage-pill-count { background: #16a34a; color: #fff; }
    .stage-pill-finish { border-color: #16a34a; color: #16a34a; font-weight: 700; }
    .stage-pill-finish .stage-pill-count { background: #16a34a; color: #fff; }

    .workflow-employer-employees {
        max-height: min(70vh, 640px);
        overflow-y: auto;
        overflow-x: hidden;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
    }

    .workflow-search-form {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        padding: 0.85rem 1rem;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.04);
    }
    .workflow-search-box {
        flex: 1 1 320px;
        min-width: 220px;
        max-width: 420px;
    }
    .workflow-search-box .form-control {
        width: 100%;
        min-height: 42px;
        border: 1px solid #dfe7f4;
        border-radius: 10px;
        background: #fff;
        box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: all 0.2s ease;
    }
    .workflow-search-box .form-control:focus {
        border-color: #ffb15f;
        box-shadow: 0 0 0 3px rgba(255, 177, 95, 0.18);
    }
    .workflow-search-btn {
        white-space: nowrap;
        min-height: 42px;
        border-radius: 10px;
        font-weight: 600;
        padding: 0.55rem 1rem;
    }
    .workflow-search-actions {
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
    }
    .workflow-search-actions .select,
    .workflow-search-actions .btn {
        min-height: 42px;
        border-radius: 10px;
    }
    .workflow-search-actions .btn {
        font-weight: 600;
    }

    @media (max-width: 767.98px) {
        .workflow-search-form {
            align-items: stretch;
            padding: 0.75rem;
        }
        .workflow-search-box,
        .workflow-search-btn,
        .workflow-search-actions {
            width: 100%;
        }
        .workflow-search-box {
            max-width: none;
        }
        .workflow-search-actions {
            margin-left: 0 !important;
            justify-content: flex-start;
        }
    }
</style>

<script>
    function getCsrfToken() {
        return document.querySelector('meta[name="csrf-token"]').content;
    }

    let workflowEmployersToReopen = [];

    async function deleteSelectedWorkflowRecords(button) {
        const selectedRecords = Array.from(
            document.querySelectorAll('.workflow-record-checkbox:checked')
        );
        if (!selectedRecords.length) {
            window.alert('Select at least one workflow record.');
            return;
        }
        if (!window.confirm(button.dataset.confirm)) return;

        const body = new URLSearchParams();
        selectedRecords.forEach((checkbox) => body.append('workflow_ids', checkbox.value));

        try {
            const response = await fetch(button.dataset.deleteUrl, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCsrfToken() },
                body: body,
            });
            if (!response.headers.get('content-type')?.includes('application/json')) {
                throw new Error('You are not authorized to delete workflow records.');
            }
            const result = await response.json();
            if (!response.ok || !result.success) {
                throw new Error(result.error || 'Unable to delete selected workflow records.');
            }

            workflowEmployersToReopen = Array.from(
                document.querySelectorAll('.workflow-employer-employees')
            )
                .filter((container) => container.style.display !== 'none')
                .map((container) => container.id.replace('employer-employees-', ''));

            const fragmentUrl = new URL(window.location.href);
            fragmentUrl.searchParams.set('_workflow_fragment', 'dashboard');
            htmx.ajax('GET', `${fragmentUrl.pathname}${fragmentUrl.search}`, {
                target: '#workflowDashboardContent',
                swap: 'outerHTML',
                pushUrl: false,
            });
        } catch (error) {
            window.alert(error instanceof Error ? error.message : 'Unable to delete selected workflow records.');
        }
    }

    document.body.addEventListener('click', function (event) {
        const button = event.target.closest('#deleteSelectedWorkflowRecords');
        if (button) {
            event.preventDefault();
            deleteSelectedWorkflowRecords(button);
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        const target = event.detail.target;
        if (!target || target.id !== 'workflowDashboardContent' || !workflowEmployersToReopen.length) {
            return;
        }

        const employerIds = workflowEmployersToReopen;
        workflowEmployersToReopen = [];
        employerIds.forEach((employerId) => {
            const container = document.getElementById(`employer-employees-${employerId}`);
            const button = container?.closest('.employer-workflow-row')
                ?.querySelector('.workflow-expand-toggle');
            if (button) {
                toggleEmployerRow(button, employerId, target.dataset.workflowCode);
            }
        });
    });

    // Any declarative hx-post/hx-get on this page (including the employee
    // workflow cards loaded later via HTMX) automatically gets the CSRF token.
    document.body.addEventListener('htmx:configRequest', function (evt) {
        evt.detail.headers['X-CSRFToken'] = getCsrfToken();
    });

    function addWorkflowStep(workflowCode) {
        const input = document.getElementById('newStepName');
        const errorBox = document.getElementById('addStepError');
        if (!input || !errorBox) return;

        const name = input.value.trim();
        errorBox.classList.add('d-none');

        if (!name) {
            errorBox.textContent = 'Step name is required.';
            errorBox.classList.remove('d-none');
            return;
        }

        htmx.ajax('POST', `/dashboard/workflow/${workflowCode}/steps/create/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
            values: { name: name },
            headers: { 'X-CSRFToken': getCsrfToken() },
        });
    }

    function toggleEditStep(stageId) {
        const nameSpan = document.getElementById(`step-name-${stageId}`);
        const nameInput = document.getElementById(`step-name-input-${stageId}`);
        if (!nameSpan || !nameInput) return;

        const isEditing = !nameInput.classList.contains('d-none');

        if (isEditing) {
            const newName = nameInput.value.trim();
            if (!newName) return;

            htmx.ajax('POST', `/dashboard/workflow/step/${stageId}/update/`, {
                target: '#workflowStepsModalContent',
                swap: 'innerHTML',
                values: { name: newName },
                headers: { 'X-CSRFToken': getCsrfToken() },
            });
        } else {
            nameSpan.classList.add('d-none');
            nameInput.classList.remove('d-none');
            nameInput.focus();
        }
    }

    function deleteStep(stageId) {
        if (!confirm('Delete this step?')) return;

        htmx.ajax('POST', `/dashboard/workflow/step/${stageId}/delete/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
            headers: { 'X-CSRFToken': getCsrfToken() },
        });
    }

    function reorderStep(stageId, direction) {
        htmx.ajax('POST', `/dashboard/workflow/step/${stageId}/reorder/${direction}/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
            headers: { 'X-CSRFToken': getCsrfToken() },
        });
    }

    function reloadStepsModal(workflowCode) {
        htmx.ajax('GET', `/dashboard/workflow/${workflowCode}/steps/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
        });
    }

    function refreshWorkflowStageSummary() {
        const modalContent = document.getElementById('workflowStepsModalContent');
        const summaryGrid = document.getElementById('workflowStagePillGrid');
        if (!modalContent || !summaryGrid || !modalContent.querySelector('.workflow-step-list')) return;

        const existingCounts = new Map(
            Array.from(summaryGrid.querySelectorAll('.stage-pill')).map((pill) => [
                pill.dataset.stageId,
                pill.querySelector('.stage-pill-count')?.textContent.trim() || '0',
            ])
        );
        const stages = Array.from(modalContent.querySelectorAll('.workflow-step-row'))
            .map((row) => ({
                id: row.dataset.stageId,
                name: row.querySelector('.workflow-step-name span')?.textContent.trim(),
            }))
            .filter((stage) => stage.id && stage.name);

        summaryGrid.replaceChildren();
        stages.forEach((stage, index) => {
            const count = existingCounts.get(stage.id) || '0';
            const pill = document.createElement('div');
            pill.className = 'stage-pill';
            pill.dataset.stageId = stage.id;
            if (index === stages.length - 1) {
                pill.classList.add('stage-pill-finish');
            } else if (Number(count) > 0) {
                pill.classList.add('stage-pill-active');
            }

            const countElement = document.createElement('span');
            countElement.className = 'stage-pill-count';
            countElement.textContent = count;
            pill.append(countElement, document.createTextNode(stage.name));
            summaryGrid.appendChild(pill);
        });
    }

    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target && event.detail.target.id === 'workflowStepsModalContent') {
            refreshWorkflowStageSummary();
        }
    });

    document.body.addEventListener('htmx:beforeSwap', function (event) {
        const target = event.detail.target;
        if (target && target.id === 'workflowStepsModalContent' &&
                !String(event.detail.serverResponse || '').includes('workflow-step-list')) {
            event.detail.shouldSwap = false;
        }
    });

    document.addEventListener('click', function (event) {
        const trigger = event.target.closest('[data-workflow-step-action]');
        if (!trigger) return;

        const action = trigger.dataset.workflowStepAction;
        const stageId = trigger.dataset.stageId;
        const workflowCode = trigger.dataset.workflowCode;

        if (trigger.hasAttribute('hx-post') && action !== 'toggle-edit-step') {
            return;
        }

        if (action === 'add-step') {
            addWorkflowStep(workflowCode);
            return;
        }

        if (action === 'toggle-edit-step' && stageId) {
            toggleEditStep(stageId);
            return;
        }

        if (action === 'delete-step' && stageId) {
            deleteStep(stageId);
            return;
        }

        if (action === 'reorder-step' && stageId) {
            reorderStep(stageId, trigger.dataset.direction || 'up');
        }
    });

    document.addEventListener('dragstart', function (event) {
        const handle = event.target.closest('.workflow-step-drag-handle');
        if (!handle) return;

        const row = handle.closest('.workflow-step-row');
        event.dataTransfer.setData('text/plain', row.dataset.stageId);
        event.dataTransfer.effectAllowed = 'move';
        row.classList.add('workflow-step-dragging');
    });

    document.addEventListener('dragend', function (event) {
        const handle = event.target.closest('.workflow-step-drag-handle');
        if (!handle) return;
        document.querySelectorAll('.workflow-step-row').forEach(function (row) {
            row.classList.remove('workflow-step-dragging', 'workflow-step-drop-target');
        });
    });

    document.addEventListener('dragover', function (event) {
        const targetRow = event.target.closest('.workflow-step-row');
        if (!targetRow) return;
        event.preventDefault();
        document.querySelectorAll('.workflow-step-row.workflow-step-drop-target').forEach(function (row) {
            row.classList.remove('workflow-step-drop-target');
        });
        targetRow.classList.add('workflow-step-drop-target');
    });

    document.addEventListener('drop', function (event) {
        const targetRow = event.target.closest('.workflow-step-row');
        const list = targetRow && targetRow.closest('.workflow-step-list');
        if (!targetRow || !list) return;
        event.preventDefault();

        const stageId = event.dataTransfer.getData('text/plain');
        const rows = Array.from(list.querySelectorAll('.workflow-step-row'));
        const currentIndex = rows.findIndex(function (row) {
            return row.dataset.stageId === stageId;
        });
        const targetIndex = rows.indexOf(targetRow);
        if (currentIndex < 0 || targetIndex < 0) return;

        const insertAfter = event.clientY >= targetRow.getBoundingClientRect().top
            + targetRow.getBoundingClientRect().height / 2;
        let destinationIndex = targetIndex + (insertAfter ? 1 : 0);
        if (currentIndex < destinationIndex) destinationIndex -= 1;
        if (currentIndex === destinationIndex) return;

        htmx.ajax('POST', `/dashboard/workflow/step/${stageId}/move/${destinationIndex + 1}/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
            headers: { 'X-CSRFToken': getCsrfToken() },
        });
    });

    function toggleEmployerRow(btn, employerId, workflowCode) {
        const container = document.getElementById(`employer-employees-${employerId}`);
        const isOpen = container.style.display !== 'none';

        if (isOpen) {
            container.style.display = 'none';
            btn.querySelector('i').className = 'ti ti-chevron-down';
            return;
        }

        container.style.display = 'block';
        btn.querySelector('i').className = 'ti ti-chevron-up';

        if (!container.dataset.loaded) {
            container.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';
            fetch(`/dashboard/workflow/${workflowCode}/employer/${employerId}/employees/`)
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    container.dataset.loaded = "true";
                    if (window.feather) feather.replace();
                });
        }
    }

    function openWorkflowStepsModal(workflowCode) {
        const contentBox = document.getElementById('workflowStepsModalContent');
        contentBox.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        contentBox.dataset.workflowCode = workflowCode;

        const modal = new bootstrap.Modal(document.getElementById('workflowStepsModal'));
        modal.show();

        htmx.ajax('GET', `/dashboard/workflow/${workflowCode}/steps/`, {
            target: '#workflowStepsModalContent',
            swap: 'innerHTML',
        });
    }

    function openAddEmployeeModal(workflowCode, employerId, workflowJobId) {
        const contentBox = document.getElementById('addEmployeeModalContent');
        contentBox.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        const modal = new bootstrap.Modal(document.getElementById('addEmployeeWorkflowModal'));
        modal.show();

        let url = `/dashboard/workflow/${workflowCode}/employee/add/`;
        if (employerId) {
            url += `?employer_id=${employerId}`;
        }
        if (workflowJobId) {
            url += `${employerId ? '&' : '?'}workflow_job_id=${workflowJobId}`;
        }
        htmx.ajax('GET', url, {
            target: '#addEmployeeModalContent',
            swap: 'innerHTML',
        });
    }

    function updateManualEmployeeAge(input) {
        const ageOutput = document.getElementById('manualEmployeeAge');
        if (!ageOutput) return;

        if (!input.value) {
            ageOutput.textContent = '—';
            return;
        }

        const [year, month, day] = input.value.split('-').map(Number);
        const today = new Date();
        let age = today.getFullYear() - year;
        if (today.getMonth() + 1 < month ||
                (today.getMonth() + 1 === month && today.getDate() < day)) {
            age -= 1;
        }
        ageOutput.textContent = age >= 0 ? String(age) : '—';
    }

    document.body.addEventListener('change', function (event) {
        if (event.target.matches('#addEmployeeModalContent [name="date_of_birth"]')) {
            updateManualEmployeeAge(event.target);
        }
    });

    document.body.addEventListener('htmx:afterSwap', function (event) {
        if (event.detail.target && event.detail.target.id === 'addEmployeeModalContent') {
            const dateOfBirth = event.detail.target.querySelector('[name="date_of_birth"]');
            if (dateOfBirth) updateManualEmployeeAge(dateOfBirth);
        }
    });

    // After employees are enrolled, wait until the modal is actually closed
    // before refreshing the page (so the success message is visible, and the
    // admin can keep checking more employees in the same session first).
    let employeesWereAdded = false;
    document.body.addEventListener('workflowEmployeesAdded', function () {
        employeesWereAdded = true;
    });
    document.getElementById('addEmployeeWorkflowModal').addEventListener('hidden.bs.modal', function () {
        if (employeesWereAdded) {
            window.location.reload();
        }
    });
</script>
{% endblock %}
